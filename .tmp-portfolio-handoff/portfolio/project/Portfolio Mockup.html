/* ── Dot-grid canvas ───────────────────────────────────────── */
function HeroCanvas() {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const COLS = 11, ROWS = 11, SPC = 34, M = 18;
    canvas.width  = M * 2 + (COLS - 1) * SPC;
    canvas.height = M * 2 + (ROWS - 1) * SPC;
    const ctx = canvas.getContext('2d');

    // Build dot grid
    const dots = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
      dots.push({ x: M + c * SPC, y: M + r * SPC, r, c,
        active: false, alpha: 0, phase: Math.random() * Math.PI * 2 });

    // Seed a few active dots
    [12, 27, 55, 80, 98].forEach(i => { if (dots[i]) dots[i].active = true; });

    const traces = []; // {x1,y1,x2,y2, p, spd, clr, done, fromDot, toDot}

    function neighbors(d) {
      const out = [];
      [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr,dc]) => {
        const nr = d.r+dr, nc = d.c+dc;
        if (nr>=0&&nr<ROWS&&nc>=0&&nc<COLS) out.push(dots[nr*COLS+nc]);
      });
      return out;
    }

    function spawnTrace() {
      const active = dots.filter(d => d.active);
      if (!active.length) { dots[Math.floor(Math.random()*dots.length)].active = true; return; }
      const from = active[Math.floor(Math.random()*active.length)];
      const nb = neighbors(from);
      if (!nb.length) return;
      const to = nb[Math.floor(Math.random()*nb.length)];
      if (traces.some(t => (t.fromDot===from&&t.toDot===to)||(t.fromDot===to&&t.toDot===from))) return;
      traces.push({ x1:from.x,y1:from.y,x2:to.x,y2:to.y,p:0,
        spd: 0.007+Math.random()*0.006,
        clr: Math.random()<0.72 ? '#D4A017' : '#7C3AED',
        done:false, fromDot:from, toDot:to });
    }

    let last = 0, animId, started = false;
    const INTERVAL = 1100;

    function frame(ts) {
      if (!started) { started = true; last = ts; }
      if (ts - last > INTERVAL) { spawnTrace(); if(Math.random()<0.35) spawnTrace(); last = ts; }

      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      // Background grid lines (very faint)
      ctx.globalAlpha = 0.04;
      ctx.strokeStyle = '#B5A882';
      ctx.lineWidth = 0.5;
      for (let c = 0; c < COLS; c++) {
        ctx.beginPath();
        ctx.moveTo(M+c*SPC, 0); ctx.lineTo(M+c*SPC, H); ctx.stroke();
      }
      for (let r = 0; r < ROWS; r++) {
        ctx.beginPath();
        ctx.moveTo(0, M+r*SPC); ctx.lineTo(W, M+r*SPC); ctx.stroke();
      }

      // Update & draw traces
      for (let i = traces.length-1; i >= 0; i--) {
        const t = traces[i];
        if (t.done) { traces.splice(i, 1); continue; }
        t.p = Math.min(1, t.p + t.spd);
        const cx = t.x1 + (t.x2-t.x1)*t.p;
        const cy = t.y1 + (t.y2-t.y1)*t.p;

        // Trailing line
        ctx.globalAlpha = 0.45;
        ctx.strokeStyle = t.clr;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(t.x1, t.y1); ctx.lineTo(cx, cy); ctx.stroke();

        // Head glow
        const grd = ctx.createRadialGradient(cx,cy,0, cx,cy,10);
        grd.addColorStop(0, t.clr+'CC');
        grd.addColorStop(1, t.clr+'00');
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.arc(cx,cy,10,0,Math.PI*2); ctx.fill();

        ctx.globalAlpha = 1;
        ctx.fillStyle = t.clr;
        ctx.beginPath(); ctx.arc(cx,cy,2.5,0,Math.PI*2); ctx.fill();

        if (t.p >= 1) { t.done = true; t.toDot.active = true; }
      }

      // Draw dots
      for (const d of dots) {
        if (d.active) d.alpha = Math.min(1, d.alpha + 0.04);
        else d.alpha = Math.max(0, d.alpha - 0.015);

        // Base dim dot
        ctx.globalAlpha = 0.18;
        ctx.fillStyle = '#B5A882';
        ctx.beginPath(); ctx.arc(d.x, d.y, 1.5, 0, Math.PI*2); ctx.fill();

        if (d.alpha > 0.01) {
          const pulse = 0.65 + 0.35 * Math.sin(ts/900 + d.phase);
          // Outer glow
          const g2 = ctx.createRadialGradient(d.x,d.y,0, d.x,d.y,14);
          g2.addColorStop(0, '#D4A01788');
          g2.addColorStop(1, '#D4A01700');
          ctx.globalAlpha = d.alpha * pulse * 0.5;
          ctx.fillStyle = g2;
          ctx.beginPath(); ctx.arc(d.x,d.y,14,0,Math.PI*2); ctx.fill();

          // Core
          ctx.globalAlpha = d.alpha * pulse;
          ctx.fillStyle = '#D4A017';
          ctx.beginPath(); ctx.arc(d.x,d.y,2.5,0,Math.PI*2); ctx.fill();

          // Randomly deactivate
          if (d.alpha > 0.95 && Math.random() < 0.002) d.active = false;
        }
      }

      ctx.globalAlpha = 1;
      animId = requestAnimationFrame(frame);
    }

    animId = requestAnimationFrame(frame);
    return () => cancelAnimationFrame(animId);
  }, []);

  return (
    <canvas ref={canvasRef} style={{ display:'block', width:'100%', height:'100%', maxWidth:400, maxHeight:400 }} />
  );
}

/* ── Sidebar ───────────────────────────────────────────────── */
function Sidebar({ activeId }) {
  const [dotTop, setDotTop] = useState(null);
  const linkRefs = useRef([]);
  const listRef = useRef(null);
  const activeIdx = NAV.findIndex(n => n.href.slice(1) === activeId);

  useEffect(() => {
    if (activeIdx < 0) return;
    const el = linkRefs.current[activeIdx];
    const list = listRef.current;
    if (!el || !list) return;
    const lr = list.getBoundingClientRect(), er = el.getBoundingClientRect();
    setDotTop(er.top - lr.top + er.height / 2 - 3);
  }, [activeIdx]);

  return (
    <header style={{
      position: 'sticky', top: 0,
      display: 'flex', flexDirection: 'column', justifyContent: 'space-between',
      height: '100vh', width: 360, flexShrink: 0, padding: '96px 0',
    }}>
      {/* Identity */}
      <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
        <h1 style={{ fontFamily:'var(--font-serif)', fontSize:'clamp(2rem,3.5vw,2.6rem)', fontWeight:400, lineHeight:1.06, letterSpacing:'-0.02em', color:'var(--fg)' }}>
          Dilshan<br/>Wickramasinghe
        </h1>
        <p style={{ fontFamily:'var(--font-mono)', fontSize:13, fontWeight:500, color:'var(--fg)', opacity:0.75, letterSpacing:'0.02em' }}>
          Full Stack &amp; Game Developer
        </p>
        <p style={{ fontFamily:'var(--font-sans)', fontSize:14, lineHeight:1.65, color:'var(--sand)', maxWidth:260 }}>
          Computer Science graduate. Fast learner. Problem solver.
        </p>
      </div>

      {/* Nav */}
      <nav>
        <ul ref={listRef} role="list" style={{ position:'relative', listStyle:'none', display:'flex', flexDirection:'column', gap:2 }}>
          {/* Sliding dot */}
          <span style={{
            position:'absolute', left:0,
            width:6, height:6, borderRadius:'50%',
            background:'var(--accent)',
            transition:'top 0.28s cubic-bezier(0.22,1,0.36,1), opacity 0.2s',
            top: dotTop !== null ? dotTop : -999,
            opacity: dotTop !== null ? 1 : 0,
          }} />
          {NAV.map((item, i) => {
            const active = NAV[i].href.slice(1) === activeId;
            return (
              <li key={item.href}>
                <a
                  ref={el => { linkRefs.current[i] = el; }}
                  href={item.href}
                  style={{
                    display:'flex', alignItems:'center', gap:6,
                    paddingLeft:20, paddingTop:10, paddingBottom:10,
                    fontFamily:'var(--font-mono)', fontSize:11,
                    letterSpacing:'0.2em', textDecoration:'none',
                    color: active ? 'var(--fg)' : 'var(--sand)',
                    transition:'color 0.2s',
                  }}
                  onMouseEnter={e => e.currentTarget.style.color = 'var(--fg)'}
                  onMouseLeave={e => { if (!active) e.currentTarget.style.color = 'var(--sand)'; }}
                >
                  {active && <span style={{ color:'var(--accent)', opacity:0.7, fontWeight:500 }}>[</span>}
                  <span>{item.label}</span>
                  {active && <span style={{ color:'var(--accent)', opacity:0.7, fontWeight:500 }}>]</span>}
                </a>
              </li>
            );
          })}
        </ul>
      </nav>

      {/* Socials */}
      <div style={{ display:'flex', alignItems:'center', gap:20 }}>
        {SITE.socials.map(s => (
          <a key={s.label} href={s.href} target="_blank" rel="noreferrer"
            aria-label={s.label}
            style={{ color:'var(--sand)', transition:'color 0.2s', display:'flex' }}
            onMouseEnter={e => e.currentTarget.style.color = 'var(--fg)'}
            onMouseLeave={e => e.currentTarget.style.color = 'var(--sand)'}
          >
            <SocialIcon name={s.label} />
          </a>
        ))}
      </div>
    </header>
  );
}

/* ── Hero Section ──────────────────────────────────────────── */
function HeroSection() {

        {/* Availability badge */}

          <span style={{ fontFamily:'var(--font-mono)', fontSize:10, letterSpacing:'0.25em', textTransform:'uppercase', color:'var(--accent)' }}>
            Available for new projects

        {/* Headline */}

          <span style={{ display:'block', color:'var(--fg)' }}>people don&rsquo;t</span>
          <span style={{ display:'block', color:'var(--accent)' }}>forget.</span>
        </h1>

        {/* Stack indicator — techy touch */}
        <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
          {['React','Next.js','NestJS','Cocos Creator'].map(t => (
            <span key={t} style={{

              letterSpacing:'0.1em', textTransform:'uppercase',

            transition:'all 0.2s',

          onMouseLeave={e=>{ e.currentTarget.style.background='transparent'; e.currentTarget.style.color='var(--accent)'; }}

        </div>
      </div>

        display:'flex', alignItems:'center', justifyContent:'center',
        overflow:'hidden',

        {/* Corner tick marks */}
        {[['top:0,left:0','borderTop,borderLeft'],['top:0,right:0','borderTop,borderRight'],['bottom:0,left:0','borderBottom,borderLeft'],['bottom:0,right:0','borderBottom,borderRight']].map(([pos], i) => {
          const s = { position:'absolute', width:16, height:16, borderColor:'var(--accent)', borderStyle:'solid', borderWidth:0 };
          if (i===0) { s.top=12; s.left=12; s.borderTopWidth=1; s.borderLeftWidth=1; }
          if (i===1) { s.top=12; s.right=12; s.borderTopWidth=1; s.borderRightWidth=1; }
          if (i===2) { s.bottom=12; s.left=12; s.borderBottomWidth=1; s.borderLeftWidth=1; }
          if (i===3) { s.bottom=12; s.right=12; s.borderBottomWidth=1; s.borderRightWidth=1; }
          return <span key={i} style={s} />;
        })}
        {/* Scan line */}
        <div style={{
          position:'absolute', inset:0, background:'repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255,255,255,0.012) 3px, rgba(255,255,255,0.012) 4px)',
          pointerEvents:'none', zIndex:1,
        }} />
        <HeroCanvas />
        {/* Label */}
        <span style={{
          position:'absolute', bottom:14, right:16,
          fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.2em', textTransform:'uppercase',
          color:'var(--sand)', opacity:0.5,
        }}>network.vis</span>
      </div>
    </section>
  );
}

/* ── Project Variants ──────────────────────────────────────── */

/* B — Code Cards */

    <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(340px, 1fr))', gap:1, marginTop:32, border:'1px solid var(--border)' }}>

      onMouseLeave={() => setHov(false)}
      style={{
        background: hov ? 'var(--muted2)' : 'var(--muted)',
        border:'1px solid var(--border)',
        cursor:'pointer', transition:'background 0.25s',
        fontFamily:'var(--font-mono)',
      }}
    >
      {/* File tab */}
      <div style={{
        display:'flex', alignItems:'center', justifyContent:'space-between',
        padding:'8px 16px',
        background: hov ? 'rgba(212,160,23,0.08)' : 'rgba(255,255,255,0.03)',
        borderBottom:`1px solid ${hov ? 'rgba(212,160,23,0.3)' : 'var(--border)'}`,
        transition:'all 0.25s',
      }}>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ display:'inline-block', width:6, height:6, borderRadius:'50%', background: hov ? 'var(--accent)' : 'var(--border2)' }} />
          <span style={{ fontSize:10, color: hov ? 'var(--accent)' : 'var(--sand)', letterSpacing:'0.05em' }}>{filename}</span>
        </div>
        <span style={{ fontSize:9, color:'var(--sand)', opacity:0.5, letterSpacing:'0.15em' }}>{p.year}</span>
      </div>

      {/* Code body */}
      <div style={{ padding:'16px 16px 20px', display:'flex', flexDirection:'column', gap:12 }}>
        {/* Comment block */}
        <div style={{ display:'flex', flexDirection:'column', gap:2 }}>
          <span style={{ fontSize:11, color:'var(--sand)', opacity:0.5 }}>{'/**'}</span>
          <span style={{ fontSize:11, color:'var(--sand)', opacity:0.5 }}>{'  * '}<span style={{ color:'var(--fg)', opacity:0.9 }}>{p.title}</span></span>
          <p style={{ fontSize:11, color:'var(--sand)', opacity:0.55, lineHeight:1.6, paddingLeft:4 }}>
            {'  * '}{p.summary}

          <span style={{ fontSize:11, color:'var(--sand)', opacity:0.5 }}>{' */'}</span>
        </div>

          <span style={{ color:'var(--detail2)' }}>import</span>

          <span style={{ color:'var(--detail2)' }}>{' from'}</span>
          <span style={{ color:'#98c379' }}>{" 'tech'"}</span>

        {/* Repos */}
        {p.repos.length > 0 && (
          <div style={{ display:'flex', gap:10, paddingTop:4, flexWrap:'wrap' }}>

/* ── Tweaks Panel ──────────────────────────────────────────── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "projectVariant": "refined",
  "accentColor": "gold"
}/*EDITMODE-END*/;

function TweaksPanel({ open, values, onChange }) {
  if (!open) return null;

  const btnStyle = (active) => ({
    fontFamily:'var(--font-mono)', fontSize:10, letterSpacing:'0.12em', textTransform:'uppercase',
    padding:'7px 14px', cursor:'pointer', border:'1px solid var(--border2)',
    background: active ? 'var(--accent)' : 'var(--muted)',
    color: active ? 'var(--bg)' : 'var(--sand)',
    transition:'all 0.2s',
  });

  return (
    <div className="tweaks-panel">
      <p style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.25em', textTransform:'uppercase', color:'var(--sand)', marginBottom:16 }}>Tweaks</p>

      <div style={{ display:'flex', flexDirection:'column', gap:20 }}>
        <div>
          <p style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.2em', textTransform:'uppercase', color:'var(--sand)', opacity:0.5, marginBottom:8 }}>Project Style</p>
          <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
            {[['refined','A — Refined List'],['code','B — Code Cards'],['table','C — Minimal Table']].map(([val, label]) => (
              <button key={val} style={btnStyle(values.projectVariant===val)} onClick={() => onChange('projectVariant', val)}>{label}</button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── App ───────────────────────────────────────────────────── */
function App() {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [activeId, setActiveId] = useState('hero');

  // Tweaks host protocol
  useEffect(() => {
    const onMsg = (e) => {
      if (e.data?.type === '__activate_edit_mode')   setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  // IntersectionObserver for active section
  useEffect(() => {
    const sections = ['hero','projects'];
    const observers = [];
    for (const id of sections) {
      const el = document.getElementById(id);
      if (!el) continue;
      const obs = new IntersectionObserver(([entry]) => {
        if (entry.isIntersecting) setActiveId(id);
      }, { rootMargin:'-40% 0px -40% 0px', threshold:0 });
      obs.observe(el);
      observers.push(obs);
    }
    return () => observers.forEach(o => o.disconnect());
  }, []);

  const handleTweak = (key, val) => {
    const next = { ...tweaks, [key]: val };
    setTweaks(next);
    window.parent.postMessage({ type:'__edit_mode_set_keys', edits: next }, '*');
  };

  return (
    <div style={{ maxWidth:1200, margin:'0 auto', padding:'0 48px', display:'flex', gap:80 }}>
      <Sidebar activeId={activeId} />
      <main style={{ flex:1, minWidth:0 }}>
        <HeroSection />
        <ProjectsSection variant={tweaks.projectVariant} />

        {/* Placeholder for other sections */}
        {['about','experience','interests','contact'].map(s => (
          <section key={s} id={s} style={{ padding:'80px 0', borderTop:'1px solid var(--border)' }}>
            <h2 style={{ fontFamily:'var(--font-mono)', fontSize:10, letterSpacing:'0.25em', textTransform:'uppercase', color:'var(--sand)' }}>{s.charAt(0).toUpperCase()+s.slice(1)}</h2>
            <p style={{ marginTop:16, color:'var(--border2)', fontFamily:'var(--font-mono)', fontSize:12, letterSpacing:'0.1em' }}>(existing section — unchanged)</p>
          </section>
        ))}
      </main>

      <TweaksPanel open={tweaksOpen} values={tweaks} onChange={handleTweak} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
